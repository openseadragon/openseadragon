<!DOCTYPE html>
<html>
<head>
    <title>Drawer Comparison Demo</title>
    <script type="text/javascript" src='../../build/openseadragon/openseadragon.js'></script>
    <script type="text/javascript" src='../lib/jquery-1.9.1.min.js'></script>
    <script type="text/javascript" src='../lib/jquery-ui-1.10.2/js/jquery-ui-1.10.2.min.js'></script>
    <link rel="stylesheet" href="../lib/jquery-ui-1.10.2/css/smoothness/jquery-ui-1.10.2.min.css">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/17/Stats.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script> -->

    <script type="module" src="./drawerperformance.js"></script>
    <style type="text/css">
        .content{
            max-width:960px;
            margin: 0 auto;
        }
        #drawer{
            height:800px;
        }
        #load-time{
            margin: 6px 0;
            font-family: monospace;
            min-height: 1.2em;
        }
        #load-time-hint{
            margin-bottom: 6px;
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="content">

        <h2>Compare performance of drawer implementations</h2>
        <div>
            <label>Select a drawer: </label>
            <select id="select-drawer">

            </select>
            <label>Num images: </label>
            <input id="input-number" type="number" value="1" min="1" step="1">
            <button id="create-drawer">Create drawer</button>
            <button id="run-benchmark" title="Recreates the viewer without the panning loop and times how long all images take to finish loading">Measure load time</button>
        </div>
        <div id="load-time"></div>
        <div id="load-time-hint">Load time is measured from the moment all images are in the world and the viewport is at home, with the panning loop switched off. Turn the browser cache off (DevTools &rarr; Network &rarr; Disable cache) or the second measurement will only time the cache.</div>
        <div id="drawer"></div>


    </div>



</body>
</html>
